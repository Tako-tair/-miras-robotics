<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#040B1F">
<title>Miras 2.8 · Team zone</title>
<style>
:root{color-scheme:dark;--bg:#040B1F;--ink:#EEF3FF;--muted:#A9BBDD;--dim:#7C90BD;--line:rgba(150,180,255,.22);--yellow:#FFC61A;--navy:#0A2A66;--glow:#4DFFC3;--red:#FF4D5E}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100vh;padding:1.5rem 1rem;background:radial-gradient(90% 60% at 50% 0%,#0B2460,transparent 70%),linear-gradient(180deg,#06112C,var(--bg));color:var(--ink);font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 46% 42%,rgba(150,185,255,.12) 0 .36rem,transparent .5rem);background-size:2.6rem 2.6rem;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000,transparent 85%);mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000,transparent 85%)}
.gate{position:relative;width:min(100%,25rem);padding:2.2rem 1.8rem 1.6rem;border-radius:1.6rem;background:linear-gradient(165deg,rgba(28,58,128,.6),rgba(8,20,54,.88) 62%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 40px 80px -30px #000;text-align:center}
.logo{display:block;width:5.4rem;height:5.4rem;margin:-4.9rem auto 1rem;border-radius:50%;border:3px solid var(--yellow);box-shadow:0 0 0 6px var(--bg),0 0 40px rgba(255,198,26,.35)}
.lock{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .8rem;border-radius:99px;background:rgba(77,255,195,.1);border:1px solid rgba(77,255,195,.35);color:#C9FFEC;font:700 .7rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
h1{margin:.8rem 0 .4rem;font:800 1.6rem/1.2 system-ui,sans-serif;letter-spacing:-.01em}
.sub{margin:0 0 1.4rem;color:var(--muted);font-size:.93rem}
form{display:grid;gap:.6rem;text-align:left}
label{font-weight:600;font-size:.88rem;color:#D7E1F7}
.field{position:relative}
input[type=password],input[type=text].pw{width:100%;font:500 1.05rem system-ui,sans-serif;color:var(--ink);background:rgba(3,10,30,.7);border:1px solid var(--line);border-radius:.85rem;padding:.85rem 3rem .85rem 1rem;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--glow);box-shadow:0 0 0 4px rgba(77,255,195,.15)}
.eye{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;display:grid;place-items:center;border:0;border-radius:.6rem;background:none;color:var(--muted);cursor:pointer}
.eye:hover{color:#fff;background:rgba(255,255,255,.07)}
.go{margin-top:.4rem;font:700 1rem system-ui,sans-serif;color:var(--navy);background:linear-gradient(180deg,#FFD84F,var(--yellow));border:0;border-radius:.85rem;padding:.85rem 1rem;cursor:pointer;box-shadow:0 .28rem 0 #B98F00;transition:transform .2s,opacity .2s}
.go:hover:not(:disabled){transform:translateY(-2px)}
.go:disabled{opacity:.55;cursor:default}
.msg{min-height:1.4em;margin:.2rem 0 0;font-size:.88rem;font-weight:600;text-align:center}
.msg.err{color:#FF8A96}.msg.warn{color:#FFD27A}
.note{margin:1.2rem 0 1rem;font-size:.78rem;color:var(--dim)}
.back{color:var(--yellow);font-weight:700;font-size:.9rem;text-decoration:none}
.back:hover{text-decoration:underline}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* ---- welcome animation after the right password ---- */
.welcome{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center;background:radial-gradient(60% 55% at 50% 42%,rgba(30,91,198,.38),transparent 70%),radial-gradient(40% 40% at 50% 100%,rgba(77,255,195,.12),transparent 70%),var(--bg);overflow:hidden;animation:wlIn .7s ease both}
@keyframes wlIn{from{opacity:0}}
.wl-stage{position:relative;width:min(11rem,42vw);aspect-ratio:1;margin-bottom:1.2rem;animation:wlPop 1.1s cubic-bezier(.2,1.25,.3,1) both}
@keyframes wlPop{from{transform:scale(.55) rotate(-8deg);opacity:0}}
.wl-halo{position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle,rgba(255,198,26,.34),rgba(77,255,195,.14) 40%,transparent 68%);animation:wlPulse 2.4s ease-in-out infinite}
@keyframes wlPulse{50%{transform:scale(1.08);opacity:.75}}
.wl-ring{position:absolute;inset:-7%;border-radius:50%;background:conic-gradient(var(--yellow),var(--glow) 30%,#3D7BEA 55%,transparent 72%,var(--yellow));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:wlSpin 2.2s linear infinite;filter:drop-shadow(0 0 10px rgba(77,255,195,.7))}
.wl-orbit{position:absolute;inset:-20%;border-radius:50%;border:1px dashed rgba(125,178,255,.4);animation:wlSpin 16s linear infinite reverse}
.wl-logo{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px var(--bg),0 24px 60px -12px #000,0 0 60px rgba(30,91,198,.6)}
.wl-sat{position:absolute;inset:-20%;animation:wlSpin 5s linear infinite}
.wl-sat::before{content:"";position:absolute;left:50%;top:0;width:.7rem;height:.7rem;margin:-.35rem 0 0 -.35rem;border-radius:50%;background:var(--glow);box-shadow:0 0 14px 3px rgba(77,255,195,.8)}
.wl-sat.s2{animation-duration:8s;animation-direction:reverse}
.wl-sat.s2::before{width:1.2rem;height:.6rem;margin:-.3rem 0 0 -.6rem;border-radius:.18rem;background:var(--yellow);box-shadow:0 0 14px 3px rgba(255,198,26,.75)}
@keyframes wlSpin{to{transform:rotate(360deg)}}
.wl-t1{margin:0;font:800 clamp(1.45rem,4.6vw,2.2rem)/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.015em;animation:wlUp .9s cubic-bezier(.2,.8,.2,1) .5s both}
.wl-t2{margin:0;font-size:clamp(1rem,2.6vw,1.2rem);font-weight:600;color:#C9FFEC;animation:wlUp .9s cubic-bezier(.2,.8,.2,1) .85s both}
.wl-t3{margin:0;font-size:.82rem;color:var(--dim);animation:wlUp .8s ease 1.15s both}
@keyframes wlUp{from{opacity:0;transform:translateY(16px);filter:blur(5px)}}
.wl-bar{width:min(16rem,62vw);height:4px;margin-top:.4rem;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;animation:wlUp .6s ease 1s both}
.wl-bar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,var(--yellow),var(--glow));box-shadow:0 0 10px var(--glow);animation:wlFill 2.3s cubic-bezier(.4,0,.2,1) .5s both}
@keyframes wlFill{from{transform:scaleX(0)}}
.wl-p{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 2px rgba(77,255,195,.8);opacity:0;animation:wlRise var(--t,5s) linear var(--d,0s) infinite}
.wl-p.y{background:var(--yellow);box-shadow:0 0 10px 2px rgba(255,198,26,.7)}
@keyframes wlRise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx,20px),-105vh);opacity:0}}
.welcome.out{animation:wlOut .55s ease forwards}
@keyframes wlOut{to{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
